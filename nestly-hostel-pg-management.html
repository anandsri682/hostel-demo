<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Santoshi Boys Hostel — Premier Accommodation in Hyderabad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F2F0E9; --surface-3:#EAE7DD;
  --border:#E4E0D5; --border-strong:#D6D1C2;
  --text:#211F1B; --text-muted:#726C60; --text-faint:#A19B8C;
  --primary:#2F6F5E; --primary-dark:#234F43; --primary-light:#E6F0EC; --primary-ink:#FFFFFF;
  --amber:#C8862A; --amber-light:#FBF0DD;
  --danger:#B5482F; --danger-light:#FBE9E3;
  --info:#3E6E9E; --info-light:#E7EFF6;
  --occupied:#3E6E9E; --available:#2F6F5E; --reserved:#C8862A; --maint:#B5482F;
  --radius-s:8px; --radius-m:14px; --radius-l:20px;
  --shadow-1:0 1px 2px rgba(33,31,27,0.06);
  --shadow-2:0 8px 24px -8px rgba(33,31,27,0.16);
  --font-head:'Sora',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#14171A; --surface:#1B1F23; --surface-2:#20252A; --surface-3:#282E34;
  --border:#2C3239; --border-strong:#3A4149;
  --text:#EDEBE6; --text-muted:#A2A099; --text-faint:#6E6B64;
  --primary:#4FB295; --primary-dark:#3C8E76; --primary-light:#1E2E2A; --primary-ink:#0E1512;
  --amber:#E3A44C; --amber-light:#2E2618;
  --danger:#E17557; --danger-light:#332019;
  --info:#6C9FCB; --info-light:#1B2732;
  --occupied:#6C9FCB; --available:#4FB295; --reserved:#E3A44C; --maint:#E17557;
  --shadow-1:0 1px 2px rgba(0,0,0,0.3); --shadow-2:0 8px 28px -8px rgba(0,0,0,0.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;}
h1,h2,h3,h4,.font-head{font-family:var(--font-head);}
button,input,select,textarea{font-family:inherit;color:inherit;}
a{color:inherit;}
::selection{background:var(--primary);color:var(--primary-ink);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
.scrollbar-none::-webkit-scrollbar{display:none;}
button{cursor:pointer;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}

/* ============ LAYOUT ============ */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:246px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:none;flex-direction:column;position:sticky;top:0;height:100vh;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(6px);}
.content{padding:18px 20px 100px;max-width:1360px;width:100%;margin:0 auto;flex:1;}
@media(min-width:1024px){
  .sidebar{display:flex;}
  .content{padding:24px 32px 48px;}
  .bottomnav{display:none !important;}
  .mobile-only{display:none !important;}
}
@media(max-width:1023px){ .desktop-only{display:none !important;} }

/* sidebar */
.sb-logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;}
.sb-logo .mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:15px;flex-shrink:0;}
.sb-nav{flex:1;overflow-y:auto;padding:6px 12px;}
.sb-section{font-size:11px;letter-spacing:.02em;color:var(--text-faint);padding:14px 10px 6px;font-weight:600;}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-s);color:var(--text-muted);font-size:14px;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;position:relative;}
.sb-item:hover{background:var(--surface-2);color:var(--text);}
.sb-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600;}
[data-theme="dark"] .sb-item.active{color:var(--primary);}
.sb-item .ic{width:18px;text-align:center;font-size:15px;}
.sb-foot{padding:14px;border-top:1px solid var(--border);}

/* topbar bits */
.tb-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text-faint);font-size:13.5px;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;flex-shrink:0;}
.icon-btn:hover{background:var(--surface-2);}
.dot-badge{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--bg);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.06);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--text-faint);font-size:10.5px;font-weight:600;transition:color .15s;}
.bn-item .ic{font-size:19px;line-height:1;}
.bn-item.active{color:var(--primary);}

/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px 16px 15px;border-left:3px solid var(--primary);}
.stat .lbl{font-size:12px;color:var(--text-muted);font-weight:500;}
.stat .val{font-family:var(--font-head);font-size:24px;font-weight:700;margin-top:4px;}
.stat .sub{font-size:11.5px;color:var(--text-faint);margin-top:3px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:transform .08s,opacity .15s,background .15s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:var(--primary-ink);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent;border-color:var(--border-strong);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-ghost:hover{background:var(--surface-3);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;}
.fab{position:fixed;right:18px;bottom:76px;z-index:35;width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow-2);}
@media(min-width:1024px){.fab{display:none;}}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:100px;white-space:nowrap;}
.badge-success{background:var(--primary-light);color:var(--primary-dark);} [data-theme=dark] .badge-success{color:var(--primary);}
.badge-amber{background:var(--amber-light);color:var(--amber);}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.badge-info{background:var(--info-light);color:var(--info);}
.badge-neutral{background:var(--surface-3);color:var(--text-muted);}

.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--text);}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--surface);}
.field{margin-bottom:14px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:var(--radius-m);border:1px solid var(--border);background:var(--surface);}
.table-wrap table{border:none;}
.table-wrap .table-wrap{border:none;}

.tab-row{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab-btn{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--primary);border-color:var(--primary);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
@media(min-width:640px){.modal-backdrop{align-items:center;padding:20px;}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;animation:slideUp .2s ease;}
@media(min-width:640px){.modal-box{border-radius:18px;animation:popIn .16s ease;}}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes popIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;}
.modal-body{padding:18px;}

.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 14px;}
.toast{background:var(--text);color:var(--bg);padding:11px 18px;border-radius:100px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;animation:toastIn .18s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.empty{padding:48px 20px;text-align:center;}
.empty .ic{font-size:34px;margin-bottom:10px;}
.empty h4{margin:0 0 4px;font-size:15px;}
.empty p{margin:0 0 14px;color:var(--text-muted);font-size:13.5px;}

.progress-bar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;}
.progress-bar>div{height:100%;background:var(--primary);border-radius:6px;}

.bed-chip{width:100%;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;gap:2px;border:1px solid transparent;}
.bed-available{background:var(--primary-light);color:var(--primary-dark);}[data-theme=dark] .bed-available{color:var(--primary)}
.bed-occupied{background:var(--info-light);color:var(--info);}
.bed-reserved{background:var(--amber-light);color:var(--amber);}
.bed-maintenance{background:var(--danger-light);color:var(--danger);}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sk 1.3s infinite ease;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.section-title{font-family:var(--font-head);font-weight:700;font-size:19px;margin:0;}
.section-sub{color:var(--text-muted);font-size:13px;margin-top:2px;}

.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-muted);}
.kv .v{font-weight:600;}

.step-dot{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--text-faint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.step-dot.done{background:var(--primary);color:var(--primary-ink);}
.step-dot.now{background:var(--primary-light);color:var(--primary-dark);border:2px solid var(--primary);}

#print-area{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{display:block !important;position:absolute;top:0;left:0;width:100%;padding:20px;}
}
.receipt-paper{background:#fff;color:#1a1a1a;border-radius:14px;padding:24px;font-family:var(--font-body);}
.receipt-paper .rline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #ddd;font-size:13.5px;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.filter-chip{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:100px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);}
.filter-chip.active{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}

.donut{border-radius:50%;flex-shrink:0;}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;}
.bar-chart .bar{flex:1;background:var(--surface-3);border-radius:6px 6px 3px 3px;position:relative;min-height:4px;transition:height .4s ease;}
.bar-chart .bar>div{position:absolute;bottom:0;left:0;right:0;background:var(--primary);border-radius:6px 6px 3px 3px;transition:height .5s ease;}
.bar-chart .lbl{font-size:10px;color:var(--text-faint);text-align:center;margin-top:6px;}

.perm-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.switch{width:38px;height:22px;border-radius:100px;background:var(--surface-3);position:relative;flex-shrink:0;border:1px solid var(--border);}
.switch.on{background:var(--primary);border-color:var(--primary);}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.switch.on i{left:18px;}

.access-denied{text-align:center;padding:80px 20px;}

/* ============ SANTOSHI BOYS HOSTEL WEBSITE STYLES ============ */
.sh-page { font-family: var(--font-body); color: var(--text); background: var(--bg); overflow-x: hidden; }

.sh-announcement { background: linear-gradient(90deg, #1E4D40, #2F6F5E, #C8862A); color: #fff; padding: 8px 16px; text-align: center; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.sh-ann-link { color: #FFE082; text-decoration: underline; font-weight: 700; }

.sh-navbar { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); transition: all 0.3s ease; }
[data-theme="dark"] .sh-navbar { background: rgba(20, 23, 26, 0.94); }
.sh-nav-container { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
.sh-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.sh-logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), #1B4D3E); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 12px rgba(47, 111, 94, 0.25); }
.sh-brand-name { font-family: var(--font-head); font-weight: 800; font-size: 19px; letter-spacing: -0.3px; line-height: 1.1; }
.sh-brand-tag { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.sh-nav-links { display: flex; align-items: center; gap: 24px; }
.sh-nav-link { text-decoration: none; color: var(--text-muted); font-weight: 600; font-size: 14px; transition: color 0.2s ease; position: relative; }
.sh-nav-link:hover, .sh-nav-link.active { color: var(--primary); }
.sh-nav-link.active::after { content: ''; position: absolute; bottom: -6px; left: 0; right: 0; height: 2.5px; background: var(--primary); border-radius: 4px; }
.sh-nav-actions { display: flex; align-items: center; gap: 12px; }

.sh-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 700; border: 1px solid transparent; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); text-decoration: none; }
.sh-btn-sm { padding: 6px 14px; font-size: 12.5px; border-radius: 8px; }
.sh-btn-lg { padding: 14px 28px; font-size: 15px; border-radius: 12px; }
.sh-btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 14px rgba(47, 111, 94, 0.28); }
.sh-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(47, 111, 94, 0.38); }
.sh-btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.sh-btn-secondary:hover { background: var(--surface-3); transform: translateY(-2px); }
.sh-btn-outline { border: 1.5px solid var(--primary); color: var(--primary); background: transparent; }
.sh-btn-outline:hover { background: var(--primary-light); }
.sh-btn-gold { background: linear-gradient(135deg, #D48828, #A66617); color: #fff; box-shadow: 0 4px 14px rgba(212, 136, 40, 0.3); }
.sh-btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 136, 40, 0.4); }
.sh-btn-block { width: 100%; text-align: center; }

.sh-mobile-menu { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-2); }
.sh-mobile-menu.hidden { display: none; }
.sh-mobile-menu a { text-decoration: none; font-size: 15px; font-weight: 600; color: var(--text); padding: 8px 0; border-bottom: 1px solid var(--border); }

.sh-hero { position: relative; padding: 60px 24px 80px; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 40px; align-items: center; }
@media(min-width: 1024px) { .sh-hero { grid-template-columns: 1.15fr 0.85fr; padding: 80px 24px 100px; } }
.sh-pill-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--primary-light); color: var(--primary-dark); padding: 6px 14px; border-radius: 30px; font-size: 12.5px; font-weight: 700; margin-bottom: 18px; border: 1px solid rgba(47,111,94,0.2); }
.sh-pill-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: glowPulse 1.8s infinite; }
@keyframes glowPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.5; } }

.sh-hero-title { font-family: var(--font-head); font-size: 36px; font-weight: 800; line-height: 1.15; letter-spacing: -0.8px; margin: 0 0 16px; }
@media(min-width: 768px) { .sh-hero-title { font-size: 48px; } }
.sh-gradient-text { background: linear-gradient(135deg, var(--primary), #C8862A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.sh-hero-desc { font-size: 16px; color: var(--text-muted); line-height: 1.6; margin: 0 0 28px; max-width: 580px; }
.sh-hero-ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 36px; }

.sh-stats-bar { display: flex; align-items: center; gap: 20px; background: var(--surface); border: 1px solid var(--border); padding: 16px 24px; border-radius: 16px; box-shadow: var(--shadow-2); flex-wrap: wrap; }
.sh-stat-item { flex: 1; min-width: 100px; text-align: center; }
.sh-stat-num { font-family: var(--font-head); font-weight: 800; font-size: 22px; color: var(--primary); }
.sh-stat-lbl { font-size: 11.5px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
.sh-stat-divider { width: 1px; height: 32px; background: var(--border); }

.sh-hero-visuals { display: flex; flex-direction: column; gap: 16px; }
@media(min-width: 640px) { .sh-hero-visuals { display: grid; grid-template-columns: 1.4fr 1fr; } }
.sh-visual-card { position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-2); border: 1px solid var(--border); }
.sh-visual-card img { width: 100%; height: 100%; min-height: 220px; max-height: 340px; object-fit: cover; transition: transform 0.4s ease; }
.sh-visual-card:hover img { transform: scale(1.05); }
.sh-visual-tag { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.sh-visual-stack { display: flex; flex-direction: column; gap: 16px; }

.sh-section { padding: 70px 24px; max-width: 1280px; margin: 0 auto; }
.sh-section-head { text-align: center; max-width: 640px; margin: 0 auto 48px; }
.sh-sub-pill { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: 1px; color: var(--primary); background: var(--primary-light); padding: 4px 12px; border-radius: 20px; margin-bottom: 10px; }
.sh-section-head h2 { font-family: var(--font-head); font-size: 30px; font-weight: 800; margin: 0 0 10px; }
@media(min-width: 768px) { .sh-section-head h2 { font-size: 36px; } }
.sh-section-head p { font-size: 15px; color: var(--text-muted); margin: 0; }

.sh-about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.sh-about-card { background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 16px; transition: transform 0.25s ease, box-shadow 0.25s ease; }
.sh-about-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-2); border-color: var(--primary); }
.sh-about-icon { font-size: 34px; margin-bottom: 14px; display: inline-block; padding: 10px; background: var(--surface-2); border-radius: 12px; }
.sh-about-card h3 { font-family: var(--font-head); font-size: 17px; font-weight: 700; margin: 0 0 8px; }
.sh-about-card p { font-size: 13.5px; color: var(--text-muted); margin: 0; line-height: 1.5; }

.sh-rooms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 24px; }
.sh-room-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; position: relative; }
.sh-room-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-2); border-color: var(--primary); }
.sh-room-card.highlight-card { border: 2px solid var(--primary); box-shadow: 0 8px 24px rgba(47, 111, 94, 0.15); }
.sh-room-badge { position: absolute; top: 12px; right: 12px; z-index: 2; background: var(--amber); color: #fff; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
.sh-room-img-wrapper { position: relative; height: 190px; overflow: hidden; }
.sh-room-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.sh-room-card:hover .sh-room-img-wrapper img { transform: scale(1.08); }
.sh-room-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
.sh-room-type { font-family: var(--font-head); font-weight: 700; font-size: 18px; margin-bottom: 6px; }
.sh-room-price { font-family: var(--font-head); font-size: 24px; font-weight: 800; color: var(--primary); margin-bottom: 14px; }
.sh-period { font-size: 13px; color: var(--text-muted); font-weight: 500; }
.sh-room-feats { list-style: none; padding: 0; margin: 0 0 20px; flex: 1; }
.sh-room-feats li { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

.sh-mess-section { background: var(--surface-2); border-radius: 24px; border: 1px solid var(--border); margin-top: 20px; }
.sh-mess-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 24px; scrollbar-width: none; }
.sh-mess-tabs::-webkit-scrollbar { display: none; }
.sh-mess-tab { padding: 10px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.2s ease; }
.sh-mess-tab.active { background: var(--primary); color: #fff; border-color: var(--primary-dark); box-shadow: 0 4px 12px rgba(47, 111, 94, 0.25); }

.sh-mess-display-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px; box-shadow: var(--shadow-1); }
.sh-meal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 16px; }
.sh-meal-box { background: var(--bg); border: 1px solid var(--border); padding: 16px; border-radius: 14px; }
.sh-meal-title { font-weight: 700; font-size: 14px; color: var(--primary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.sh-meal-time { font-size: 11px; color: var(--text-faint); font-weight: 600; margin-bottom: 8px; }
.sh-meal-items { font-size: 13px; color: var(--text); line-height: 1.5; }

.sh-fac-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.sh-fac-card { background: var(--surface); border: 1px solid var(--border); padding: 22px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; transition: transform 0.2s ease; }
.sh-fac-card:hover { transform: translateY(-4px); border-color: var(--primary); }
.sh-fac-icon { font-size: 28px; }
.sh-fac-card h4 { font-family: var(--font-head); font-size: 16px; font-weight: 700; margin: 0; }
.sh-fac-card p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.4; }

.sh-gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.sh-gallery-item { position: relative; border-radius: 16px; overflow: hidden; height: 210px; border: 1px solid var(--border); }
.sh-gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.sh-gallery-item:hover img { transform: scale(1.08); }
.sh-gallery-cap { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); color: #fff; padding: 20px 14px 10px; font-size: 13px; font-weight: 700; }

.sh-test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.sh-test-card { background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 18px; box-shadow: var(--shadow-1); }
.sh-test-stars { color: #F59E0B; font-size: 15px; margin-bottom: 12px; }
.sh-test-card p { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; font-style: italic; margin-bottom: 18px; }
.sh-test-author { display: flex; align-items: center; gap: 12px; }
.sh-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.sh-test-name { font-weight: 700; font-size: 14px; }
.sh-test-role { font-size: 11.5px; color: var(--text-muted); }

.sh-contact-container { display: grid; grid-template-columns: 1fr; gap: 40px; }
@media(min-width: 900px) { .sh-contact-container { grid-template-columns: 1fr 1fr; } }
.sh-contact-info { display: flex; flex-direction: column; gap: 18px; }
.sh-info-list { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
.sh-info-item { display: flex; gap: 14px; font-size: 13.5px; color: var(--text-muted); }
.sh-info-icon { font-size: 22px; flex-shrink: 0; }
.sh-portal-box { background: var(--primary-light); border: 1px solid rgba(47,111,94,0.2); border-radius: 16px; padding: 20px; margin-top: 16px; }
.sh-portal-box h4 { margin: 0 0 6px; font-family: var(--font-head); font-size: 15px; color: var(--primary-dark); }
.sh-portal-box p { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }

.sh-contact-form-card { background: var(--surface); border: 1px solid var(--border); padding: 30px; border-radius: 20px; box-shadow: var(--shadow-2); }
.sh-contact-form-card h3 { font-family: var(--font-head); font-size: 20px; font-weight: 800; margin: 0 0 6px; }
.sh-contact-form-card p { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }

.sh-footer { background: #121619; color: #EDEBE6; padding: 50px 24px 24px; margin-top: 60px; }
.sh-footer-inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 36px; padding-bottom: 40px; border-bottom: 1px solid #2C3239; }
.sh-footer a { color: #A2A099; text-decoration: none; transition: color 0.2s ease; }
.sh-footer a:hover { color: #fff; }
.sh-footer-bottom { max-width: 1280px; margin: 24px auto 0; text-align: center; font-size: 12.5px; color: #6E6B64; }

</style>
</head>
<body data-theme="light">
<div id="app"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-root"></div>
<div id="print-area"></div>

<script>
/* =========================================================================
   NESTLY — HOSTEL / PG MANAGEMENT SYSTEM (demo)
   Single-file vanilla JS app. Everything below is in-memory demo data.
   ========================================================================= */

/* ---------------- UTILITIES ---------------- */
let UID = 1000;
const uid = (p='ID') => `${p}-${(UID++).toString(36).toUpperCase()}`;
const rand = (arr) => arr[Math.floor(Math.random()*arr.length)];
const randInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const fmt = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtDate = (d) => new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const fmtDateTime = (d) => new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const initials = (name) => name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const esc = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString(); };
const daysFromNow = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString(); };

function badge(text, type='neutral', icon=''){ return `<span class="badge badge-${type}">${icon?icon+' ':''}${esc(text)}</span>`; }

function toast(msg, type='success'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${type==='success'?'✓':type==='error'?'⚠️':'ℹ️'}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" data-close-modal>
    <div class="modal-box" onclick="event.stopPropagation()">${html}</div></div>`;
  document.querySelector('[data-close-modal]').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function confirmDialog(title, msg, confirmLabel, onConfirmAction){
  openModal(`
    <div class="modal-body" style="text-align:center;padding-top:26px;">
      <div style="font-size:34px;margin-bottom:10px;">⚠️</div>
      <h3 style="margin:0 0 8px;font-family:var(--font-head);">${esc(title)}</h3>
      <p style="color:var(--text-muted);font-size:13.5px;margin:0 0 22px;">${esc(msg)}</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline btn-block" onclick="closeModal()">Cancel</button>
        <button class="btn btn-danger btn-block" onclick="${onConfirmAction};closeModal();">${esc(confirmLabel)}</button>
      </div>
    </div>`);
}

function emptyState(icon, title, desc, actionHtml=''){
  return `<div class="empty"><div class="ic">${icon}</div><h4>${esc(title)}</h4><p>${esc(desc)}</p>${actionHtml}</div>`;
}

/* ---------------- SEED DATA ---------------- */
const FIRST = ["Aarav","Vivaan","Aditya","Vihaan","Arjun","Sai","Reyansh","Krishna","Ishaan","Kabir","Rohan","Karan","Nikhil","Yash","Aryan","Dev","Rahul","Siddharth","Ananya","Diya","Isha","Priya","Sneha","Neha","Pooja","Kavya","Riya","Shreya","Meera","Tanvi","Aisha","Zara"];
const LAST = ["Sharma","Verma","Reddy","Iyer","Nair","Gupta","Rao","Patel","Kumar","Singh","Das","Menon","Pillai","Chatterjee","Mehta","Joshi","Bansal","Kapoor","Bhat","Naik"];
const fullName = () => `${rand(FIRST)} ${rand(LAST)}`;

const DB = { properties:[], rooms:[], tenants:[], staff:[], payments:[], expenses:[], complaints:[], tasks:[], visitors:[], notifications:[] };

function seed(){
  // Properties
  const propDefs = [
    {name:"Sunrise PG", location:"Gachibowli, Hyderabad", address:"Plot 14, Financial District Rd, Gachibowli", phone:"+91 98480 11223"},
    {name:"Green View Residency", location:"Madhapur, Hyderabad", address:"Road No. 36, Jubilee Hills Border, Madhapur", phone:"+91 90000 44556"},
    {name:"City Comfort PG", location:"Kondapur, Hyderabad", address:"Botanical Garden Rd, Kondapur", phone:"+91 96666 77889"},
  ];
  const managers = [];
  propDefs.forEach((p,i)=>{
    const mgrName = i===0? "Rajesh Kumar" : i===1 ? "Sunita Reddy" : "Arvind Nair";
    const prop = { id: uid('PG'), ...p, managerName: mgrName, status:'Active' };
    DB.properties.push(prop);
  });

  // Staff (deterministic core roles + workers)
  const staffSeed = [
    {name:"Rajesh Kumar", role:"Manager", prop:0},
    {name:"Sunita Reddy", role:"Manager", prop:1},
    {name:"Arvind Nair", role:"Manager", prop:2},
    {name:"Meena Iyer", role:"Accountant", prop:0},
    {name:"Farhan Sheikh", role:"Accountant", prop:1},
    {name:"Ramesh Yadav", role:"Warden", prop:0},
    {name:"Lakshmi Devi", role:"Warden", prop:1},
    {name:"Suresh Babu", role:"Warden", prop:2},
    {name:"Ganesh Pal", role:"Cleaner", prop:0},
    {name:"Mahesh Rao", role:"Cleaner", prop:1},
    {name:"Vikram Singh", role:"Maintenance", prop:0},
    {name:"Anil Kumar", role:"Maintenance", prop:2},
    {name:"Bharat Chowdary", role:"Security", prop:0},
    {name:"Deepak Verma", role:"Security", prop:1},
  ];
  const defaultPerms = { viewTenants:true, manageRooms:false, manageFees:false, printReceipts:false, viewReports:false, manageComplaints:false, manageMaintenance:false };
  staffSeed.forEach((s,i)=>{
    const perms = {...defaultPerms};
    if(s.role==='Manager'){ Object.keys(perms).forEach(k=>perms[k]=true); }
    if(s.role==='Accountant'){ perms.manageFees=true; perms.printReceipts=true; perms.viewReports=true; }
    if(s.role==='Warden'){ perms.manageComplaints=true; perms.viewTenants=true; }
    if(s.role==='Maintenance'||s.role==='Cleaner'){ perms.manageMaintenance=true; }
    DB.staff.push({
      id: uid('STF'), name:s.name, phone:`+91 9${randInt(100000000,999999999)}`.slice(0,13),
      email: s.name.toLowerCase().replace(/ /g,'.')+'@nestly.demo',
      role:s.role, propertyId: DB.properties[s.prop].id, propertyName: DB.properties[s.prop].name,
      joiningDate: daysAgo(randInt(60,900)), status:'Active', permissions: perms,
      photo: initials(s.name)
    });
  });

  // Rooms + beds per property
  const roomTypes = ["Single Sharing","Double Sharing","Triple Sharing","Four Sharing"];
  DB.properties.forEach((prop, pi)=>{
    const floors = 3;
    let roomCounter = 1;
    const numRooms = pi===0?8:pi===1?7:7;
    for(let r=0;r<numRooms;r++){
      const floor = Math.floor(r/3)+1;
      const capacity = rand([2,2,3,3,4,4,6]);
      const type = capacity===2?"Double Sharing":capacity===3?"Triple Sharing":capacity===4?"Four Sharing":"Dormitory (6)";
      const rent = capacity===2?9500:capacity===3?8000:capacity===4?7000:5500;
      const roomNo = `${floor}0${roomCounter}`;
      roomCounter++;
      const beds = [];
      for(let b=0;b<capacity;b++){
        beds.push({ id: uid('BED'), label: String.fromCharCode(65+b), status:'available', tenantId:null });
      }
      DB.rooms.push({ id: uid('RM'), propertyId: prop.id, propertyName: prop.name, number: roomNo, floor, type, capacity, rent, beds });
    }
  });

  // Tenants — fill most beds
  const allBeds = [];
  DB.rooms.forEach(room => room.beds.forEach(bed => allBeds.push({room, bed})));
  const idProofs = ["Aadhaar Card","PAN Card","Passport","Voter ID"];
  const numTenants = Math.min(allBeds.length - 6, 34); // leave some beds free
  const shuffled = allBeds.sort(()=>Math.random()-0.5);
  for(let i=0;i<numTenants;i++){
    const {room,bed} = shuffled[i];
    const name = fullName();
    const gender = rand(['Male','Female']);
    const checkIn = daysAgo(randInt(10,540));
    const rent = room.rent;
    const deposit = rent*2;
    const paidStatusRoll = Math.random();
    let pending = 0, status='paid';
    if(paidStatusRoll < 0.5){ pending = 0; status='paid'; }
    else if(paidStatusRoll < 0.72){ pending = Math.round(rent*rand([0.3,0.5,0.6])); status='partial'; }
    else if(paidStatusRoll < 0.9){ pending = rent; status='pending'; }
    else { pending = rent*2; status='overdue'; }
    const tenant = {
      id: uid('TEN'), name, photo: initials(name), phone:`+91 9${randInt(100000000,999999999)}`.slice(0,13),
      email: name.toLowerCase().replace(/ /g,'.')+'@mail.com',
      dob: `19${randInt(96,99)}-0${randInt(1,9)}-${randInt(10,28)}`, gender,
      address: `${randInt(1,400)}, ${rand(['Anand Nagar','Vijay Nagar','Sai Nagar','MG Road','Kondapur','Miyapur'])}, Hyderabad`,
      emergency: { name: fullName(), phone:`+91 9${randInt(100000000,999999999)}`.slice(0,13), relation: rand(['Father','Mother','Brother','Sister']) },
      propertyId: room.propertyId, propertyName: room.propertyName, roomId: room.id, roomNumber: room.number, bedId: bed.id, bedLabel: bed.label,
      checkIn, expectedCheckout: daysFromNow(randInt(30,300)), status:'Active',
      monthlyRent: rent, deposit, dueDate: 5, pending, paymentStatus: status,
      lastPaymentDate: pending>0 ? daysAgo(randInt(32,70)) : daysAgo(randInt(1,20)),
      documents: [ {name:rand(idProofs), type:'ID Proof'}, {name:'Rental Agreement', type:'Agreement'} ]
    };
    DB.tenants.push(tenant);
    bed.status='occupied'; bed.tenantId = tenant.id;
  }
  // mark a couple beds reserved/maintenance for realism
  const freeBeds = allBeds.filter(x=>x.bed.status==='available');
  if(freeBeds[0]) freeBeds[0].bed.status='reserved';
  if(freeBeds[1]) freeBeds[1].bed.status='maintenance';

  // Payments (history) — generate from tenants + extra past months
  const methods = ["Cash","UPI","Bank Transfer","Online Payment"];
  let recCounter = 118;
  DB.tenants.forEach(t=>{
    const monthsBack = randInt(1,4);
    for(let m=monthsBack;m>=1;m--){
      if(m===1 && t.pending>0) continue; // current month unpaid/partial handled by pending
      recCounter++;
      DB.payments.push({
        id: uid('PAY'), receiptNo: `RCPT-2026-${String(recCounter).padStart(5,'0')}`,
        tenantId:t.id, tenantName:t.name, propertyId:t.propertyId, propertyName:t.propertyName,
        roomNumber:t.roomNumber, bedLabel:t.bedLabel, feeType:'Monthly Rent', amount:t.monthlyRent,
        date: daysAgo(m*30 + randInt(0,4)), method: rand(methods), txnId: 'TXN'+randInt(100000,999999),
        status:'Paid', previousBalance:0, paidAmount:t.monthlyRent, remainingBalance:0, notes:''
      });
    }
    if(t.paymentStatus==='partial'){
      recCounter++;
      DB.payments.push({
        id: uid('PAY'), receiptNo: `RCPT-2026-${String(recCounter).padStart(5,'0')}`,
        tenantId:t.id, tenantName:t.name, propertyId:t.propertyId, propertyName:t.propertyName,
        roomNumber:t.roomNumber, bedLabel:t.bedLabel, feeType:'Monthly Rent (Partial)', amount:t.monthlyRent-t.pending,
        date: t.lastPaymentDate, method: rand(methods), txnId:'TXN'+randInt(100000,999999),
        status:'Partial', previousBalance:t.monthlyRent, paidAmount:t.monthlyRent-t.pending, remainingBalance:t.pending, notes:''
      });
    }
  });
  DB.payments.sort((a,b)=> new Date(b.date)-new Date(a.date));

  // Expenses
  const catAmt = {Electricity:[3000,9000],Water:[1500,4000],Internet:[1200,2500],Maintenance:[800,6000],Cleaning:[1000,3000],Salaries:[8000,25000],"Food/Mess":[15000,40000],Repairs:[500,8000],Other:[300,2500]};
  const cats = Object.keys(catAmt);
  for(let i=0;i<24;i++){
    const cat = rand(cats); const [lo,hi] = catAmt[cat]; const prop = rand(DB.properties);
    DB.expenses.push({ id: uid('EXP'), propertyId:prop.id, propertyName:prop.name, category:cat, amount: randInt(lo,hi),
      date: daysAgo(randInt(0,58)), description: `${cat} - ${prop.name}`, paidBy: rand(DB.staff.filter(s=>s.role==='Manager')).name });
  }
  DB.expenses.sort((a,b)=> new Date(b.date)-new Date(a.date));

  // Complaints
  const compCats = ["Plumbing","Electricity","Cleaning","Wi-Fi","Room","Food","Security","Other"];
  const compTitles = {Plumbing:"Leaking tap in bathroom",Electricity:"Room light not working",Cleaning:"Common area needs cleaning",Wifi:"Wi-Fi signal weak",Room:"Cupboard door broken",Food:"Mess food quality issue",Security:"Main gate lock issue",Other:"General maintenance request"};
  const wardenWorkers = DB.staff.filter(s=>['Cleaner','Maintenance','Security'].includes(s.role));
  for(let i=0;i<13;i++){
    const t = rand(DB.tenants); const cat = rand(compCats);
    const status = rand(['Open','Assigned','In Progress','Resolved','Resolved','Open']);
    DB.complaints.push({ id: uid('CMP'), title: compTitles[cat]||compTitles.Other, category:cat,
      description:`Reported by tenant regarding ${cat.toLowerCase()} issue in room ${t.roomNumber}.`,
      propertyId:t.propertyId, propertyName:t.propertyName, roomNumber:t.roomNumber, tenantId:t.id, tenantName:t.name,
      priority: rand(['Low','Medium','High']), createdDate: daysAgo(randInt(0,20)),
      assignedWorkerId: status==='Open'?null:rand(wardenWorkers).id, status });
  }

  // Tasks
  const taskSeed = ["Room {r} deep cleaning","Fix bathroom tap - Room {r}","Replace light bulb - Room {r}","Common area cleaning","Pest control - Floor {f}","AC servicing - Room {r}","Fix door lock - Room {r}","Water tank cleaning"];
  for(let i=0;i<16;i++){
    const room = rand(DB.rooms); const worker = rand(wardenWorkers);
    const title = rand(taskSeed).replace('{r}', room.number).replace('{f}', room.floor);
    DB.tasks.push({ id: uid('TSK'), title, description:`Assigned task at ${room.propertyName}, Room ${room.number}.`,
      assignedWorkerId: worker.id, assignedWorkerName: worker.name, priority: rand(['Low','Medium','High']),
      propertyId: room.propertyId, propertyName: room.propertyName, roomNumber: room.number,
      dueDate: daysFromNow(randInt(-2,7)), status: rand(['Pending','Pending','In Progress','Completed']) });
  }

  // Visitors
  for(let i=0;i<9;i++){
    const t = rand(DB.tenants);
    const entered = randInt(0,1)===0;
    DB.visitors.push({ id: uid('VIS'), name: fullName(), phone:`+91 9${randInt(100000000,999999999)}`.slice(0,13),
      tenantId:t.id, tenantName:t.name, roomNumber:t.roomNumber, propertyName:t.propertyName,
      purpose: rand(['Family visit','Friend visit','Delivery','Guest stay']),
      entryTime: daysAgo(0), exitTime: entered? null : daysAgo(0), idProof: rand(idProofs),
      status: entered? 'Checked In' : 'Checked Out' });
  }

  // Notifications
  const notifSeed = [
    {type:'Payment received', icon:'💰'}, {type:'Rent due', icon:'⏰'}, {type:'Payment overdue', icon:'⚠️'},
    {type:'Complaint update', icon:'🛠️'}, {type:'Check-in confirmation', icon:'✅'}, {type:'Maintenance update', icon:'🔧'},
    {type:'Checkout reminder', icon:'📦'}, {type:'Announcement', icon:'📢'}
  ];
  for(let i=0;i<12;i++){
    const n = rand(notifSeed); const t = rand(DB.tenants);
    DB.notifications.push({ id: uid('NTF'), type:n.type, icon:n.icon,
      message: `${n.type} — ${t.name}, Room ${t.roomNumber}`,
      date: daysAgo(randInt(0,6)), read: Math.random()>0.45 });
  }
  DB.notifications.sort((a,b)=> new Date(b.date)-new Date(a.date));
}
seed();

/* Recompute-able aggregate helpers */
function allBedsFlat(){ const out=[]; DB.rooms.forEach(r=>r.beds.forEach(b=>out.push({...b, room:r}))); return out; }
function occupancyFor(propertyId){
  const rooms = propertyId? DB.rooms.filter(r=>r.propertyId===propertyId): DB.rooms;
  let total=0, occ=0;
  rooms.forEach(r=>{ total+=r.beds.length; occ+=r.beds.filter(b=>b.status==='occupied').length; });
  return {total, occ, avail: total-occ};
}
function monthlyRevenue(propertyId){
  const tenants = propertyId? DB.tenants.filter(t=>t.propertyId===propertyId && t.status==='Active') : DB.tenants.filter(t=>t.status==='Active');
  return tenants.reduce((s,t)=>s+t.monthlyRent,0);
}
function totalPending(propertyId){
  const tenants = propertyId? DB.tenants.filter(t=>t.propertyId===propertyId): DB.tenants;
  return tenants.reduce((s,t)=>s+t.pending,0);
}

/* ---------------- ROUTER / RENDER ---------------- */
function setView(view, params={}){
  if(view!=='website' && view!=='login' && !canAccess(view)){
    STATE.view='access-denied'; STATE.params={attempted:view}; render(); return;
  }
  STATE.view = view; STATE.params = params; window.scrollTo(0,0); render();
}
function go(view, params){ setView(view, params); }

function login(role){
  const u = DEMO_USERS.find(x=>x.role===role);
  STATE.user = u; STATE.view='dashboard'; STATE.params={};
  toast(`Welcome back, ${u.name.split(' ')[0]}`);
  render();
}
function logout(){ STATE.user=null; STATE.view='login'; render(); }
function toggleTheme(){
  STATE.theme = STATE.theme==='light'?'dark':'light';
  document.body.setAttribute('data-theme', STATE.theme);
  render();
}

function render(){
  const app = document.getElementById('app');
  if(STATE.view === 'website'){
    app.innerHTML = renderWebsite();
    attachWebsiteHandlers();
    window.scrollTo(0,0);
    return;
  }
  if(!STATE.user || STATE.view==='login'){
    app.innerHTML = renderLogin();
    return;
  }
  app.innerHTML = renderShell();
  attachGlobalHandlers();
}

function openSearch(){
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Search</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <input id="global-search-input" placeholder="Search tenants, rooms, receipts, staff…" autofocus oninput="doGlobalSearch(this.value)"
        style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:14.5px;">
      <div id="global-search-results" style="margin-top:14px;max-height:50vh;overflow-y:auto;"></div>
    </div>`);
  setTimeout(()=>document.getElementById('global-search-input')?.focus(),50);
}
function doGlobalSearch(q){
  const root = document.getElementById('global-search-results');
  q = q.trim().toLowerCase();
  if(q.length<2){ root.innerHTML = `<p style="color:var(--text-faint);font-size:13px;text-align:center;padding:20px 0;">Type at least 2 characters…</p>`; return; }
  let out = [];
  DB.tenants.filter(t=>t.name.toLowerCase().includes(q)||t.roomNumber.includes(q)).slice(0,5).forEach(t=>
    out.push(`<div class="sb-item" style="padding:10px;" onclick="closeModal();go('tenant-detail',{id:'${t.id}'})"><span class="ic">👤</span><span>${t.name} — Room ${t.roomNumber}${badge(paymentStatusMeta(t.paymentStatus).label,paymentStatusMeta(t.paymentStatus).type)}</span></div>`));
  DB.rooms.filter(r=>r.number.includes(q)).slice(0,4).forEach(r=>
    out.push(`<div class="sb-item" style="padding:10px;" onclick="closeModal();go('rooms')"><span class="ic">🛏️</span><span>Room ${r.number} — ${r.propertyName}</span></div>`));
  DB.payments.filter(p=>p.receiptNo.toLowerCase().includes(q)||p.tenantName.toLowerCase().includes(q)).slice(0,4).forEach(p=>
    out.push(`<div class="sb-item" style="padding:10px;" onclick="closeModal();openReceipt('${p.id}')"><span class="ic">🧾</span><span>${p.receiptNo} — ${p.tenantName}</span></div>`));
  DB.staff.filter(s=>s.name.toLowerCase().includes(q)).slice(0,4).forEach(s=>
    out.push(`<div class="sb-item" style="padding:10px;"><span class="ic">🧑‍💼</span><span>${s.name} — ${s.role}</span></div>`));
  DB.complaints.filter(c=>c.title.toLowerCase().includes(q)).slice(0,4).forEach(c=>
    out.push(`<div class="sb-item" style="padding:10px;" onclick="closeModal();go('complaints')"><span class="ic">📣</span><span>${c.title} — ${c.tenantName}</span></div>`));
  root.innerHTML = out.length ? out.join('') : emptyState('🔍','No results', `Nothing matches "${esc(q)}"`);
}

function miniBarChart(values, labels, height=110){
  const max = Math.max(...values, 1);
  return `<div class="bar-chart" style="height:${height}px;">
    ${values.map((v,i)=>`<div class="bar" style="height:100%;"><div style="height:${(v/max*100).toFixed(0)}%;"></div></div>`).join('')}
  </div>
  <div style="display:flex;gap:8px;margin-top:2px;">${labels.map(l=>`<div class="lbl" style="flex:1;">${l}</div>`).join('')}</div>`;
}

function workerTaskCard(t){
  return `<div class="card" style="padding:14px;">
    <div style="display:flex;justify-content:space-between;gap:8px;">
      <strong style="font-size:14px;">${t.title}</strong>
      ${badge(t.priority, t.priority==='High'?'danger':t.priority==='Medium'?'amber':'neutral')}
    </div>
    <div style="font-size:12.5px;color:var(--text-faint);margin:5px 0 12px;">${t.propertyName} · Room ${t.roomNumber} · Due ${fmtDate(t.dueDate)}</div>
    <div style="display:flex;gap:8px;">
      ${t.status==='Pending'?`<button class="btn btn-sm btn-outline btn-block" onclick="updateTaskStatus('${t.id}','In Progress')">Start Task</button>`:''}
      ${t.status==='In Progress'?`<button class="btn btn-sm btn-primary btn-block" onclick="updateTaskStatus('${t.id}','Completed')">Mark Completed</button>`:''}
      ${t.status==='Pending'?`<button class="btn btn-sm btn-primary" onclick="updateTaskStatus('${t.id}','Completed')">Complete</button>`:''}
    </div>
  </div>`;
}
function updateTaskStatus(id, status){
  const t = DB.tasks.find(x=>x.id===id); if(!t) return; t.status=status;
  toast(`Task marked ${status}`); render();
}
function updateComplaintStatus(id, status){
  const c = DB.complaints.find(x=>x.id===id); if(!c) return; c.status=status;
  toast(`Complaint marked ${status}`); render();
}

function doCheckout(tenantId){
  const t = DB.tenants.find(x=>x.id===tenantId);

  closeModal(); toast(`${t.name} checked out. Final settlement recorded.`); go('tenants');
}

/* ---- Tenant registration wizard ---- */
let REG = {};
function renderTenantRegister(){
  REG = { step:1, propertyId: DB.properties[0].id, roomId: STATE.params.roomId||'', bedId: STATE.params.bedId||'',
    name:'', phone:'', email:'', dob:'', gender:'Male', address:'', emName:'', emPhone:'', emRelation:'Father',
    rent:0, deposit:0, docs:[] };
  if(STATE.params.roomId){ const room = DB.rooms.find(r=>r.id===STATE.params.roomId); if(room){ REG.propertyId=room.propertyId; REG.rent=room.rent; REG.deposit=room.rent*2; REG.step=4; } }
  return `<div id="reg-wizard">${renderRegStep()}</div>`;
}
const REG_STEPS = ['Personal','Emergency','Select PG','Select Room','Select Bed','Fee Details','Documents','Review'];
function regStepper(){
  return `<div style="display:flex;align-items:center;gap:4px;margin-bottom:22px;overflow-x:auto;padding-bottom:4px;" class="scrollbar-none">
    ${REG_STEPS.map((s,i)=>{const n=i+1; const cls= n<REG.step?'done':n===REG.step?'now':'';
      return `<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <div class="step-dot ${cls}">${n<REG.step?'✓':n}</div>
        <span style="font-size:11.5px;color:${n===REG.step?'var(--text)':'var(--text-faint)'};font-weight:${n===REG.step?'700':'500'};white-space:nowrap;">${s}</span>
        ${i<REG_STEPS.length-1?`<div style="width:16px;height:1px;background:var(--border);"></div>`:''}
      </div>`;}).join('')}
  </div>`;
}
function regNav(canNext=true){
  return `<div style="display:flex;gap:10px;margin-top:20px;">
    ${REG.step>1?`<button class="btn btn-outline btn-block" onclick="regBack()">Back</button>`:`<button class="btn btn-outline btn-block" onclick="go('tenants')">Cancel</button>`}
    ${REG.step<8?`<button class="btn btn-primary btn-block" onclick="regNext()">Continue</button>`:`<button class="btn btn-primary btn-block" onclick="regSubmit()">Confirm &amp; Register</button>`}
  </div>`;
}
function regRerender(){ document.getElementById('reg-wizard').innerHTML = renderRegStep(); }
function regBack(){ REG.step--; regRerender(); }
function regNext(){
  if(REG.step===1){ REG.name=document.getElementById('r-name').value; REG.phone=document.getElementById('r-phone').value; REG.email=document.getElementById('r-email').value; REG.dob=document.getElementById('r-dob').value; REG.gender=document.getElementById('r-gender').value; REG.address=document.getElementById('r-address').value;
    if(!REG.name||!REG.phone){ toast('Please enter name and phone number','error'); return; } }
  if(REG.step===2){ REG.emName=document.getElementById('r-emname').value; REG.emPhone=document.getElementById('r-emphone').value; REG.emRelation=document.getElementById('r-emrel').value;
    if(!REG.emName||!REG.emPhone){ toast('Please fill emergency contact details','error'); return; } }
  if(REG.step===3){ if(!REG.propertyId){ toast('Please select a PG','error'); return; } }
  if(REG.step===4){ if(!REG.roomId){ toast('Please select a room','error'); return; } }
  if(REG.step===5){ if(!REG.bedId){ toast('Please select a bed','error'); return; } }
  if(REG.step===6){ REG.rent=Number(document.getElementById('r-rent').value); REG.deposit=Number(document.getElementById('r-deposit').value); }

function submitPayment(tenantId){
  const t = DB.tenants.find(x=>x.id===tenantId);
  const amount = Number(document.getElementById('pf-amount').value)||0;
  const feeType = document.getElementById('pf-feetype').value;
  const date = document.getElementById('pf-date').value || new Date().toISOString().slice(0,10);
  const txnId = document.getElementById('pf-txn').value || ('TXN'+randInt(100000,999999));
  const notes = document.getElementById('pf-notes').value;
  const method = STATE.cart.method;
  if(amount<=0){ toast('Enter a valid amount','error'); return; }

  const prevBalance = t.pending;
  const remaining = Math.max(0, prevBalance - amount) + (amount < prevBalance ? 0:0);
  const newPending = Math.max(0, prevBalance - amount);
  t.pending = newPending;
  t.paymentStatus = newPending===0 ? 'paid' : (newPending < t.monthlyRent ? 'partial' : 'overdue');
  t.lastPaymentDate = new Date(date).toISOString();

  const receiptNo = `RCPT-2026-${randInt(30000,39999)}`;
  const payment = { id: uid('PAY'), receiptNo, tenantId:t.id, tenantName:t.name, propertyId:t.propertyId, propertyName:t.propertyName,
    roomNumber:t.roomNumber, bedLabel:t.bedLabel, feeType, amount, date:new Date(date).toISOString(), method, txnId,
    status: newPending>0?'Partial':'Paid', previousBalance:prevBalance, paidAmount:amount, remainingBalance:newPending, notes };
  DB.payments.unshift(payment);

  showPaymentSuccess(payment);
}

/* ================= EXPENSES ================= */
function renderExpenses(){
  const total = DB.expenses.reduce((s,e)=>s+e.amount,0);
  const today = new Date().toDateString();
  const todayTotal = DB.expenses.filter(e=>new Date(e.date).toDateString()===today).reduce((s,e)=>s+e.amount,0);
  const monthTotal = DB.expenses.filter(e=>new Date(e.date).getMonth()===new Date().getMonth()).reduce((s,e)=>s+e.amount,0);
  const byCat = {};
  DB.expenses.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+e.amount; });
  const maxCat = Math.max(...Object.values(byCat));
  return `
  ${pageHeader('Expenses', 'Track operating costs across properties.', `<button class="btn btn-primary btn-sm" onclick="openAddExpense()">+ Add Expense</button>`)}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">
    <div class="stat" style="border-left-color:var(--danger);"><div class="lbl">Total Expenses</div><div class="val">${fmt(total)}</div></div>
    <div class="stat"><div class="lbl">This Month</div><div class="val">${fmt(monthTotal)}</div></div>
    <div class="stat"><div class="lbl">Today</div><div class="val">${fmt(todayTotal)}</div></div>
  </div>
  <div class="card" style="padding:18px;margin-bottom:18px;">
    <h3 style="margin:0 0 14px;font-size:15px;">Category Breakdown</h3>
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
      <div style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;"><span>${cat}</span><span style="font-weight:600;">${fmt(amt)}</span></div>
        <div class="progress-bar"><div style="width:${(amt/maxCat*100).toFixed(0)}%;"></div></div>
      </div>`).join('')}
  </div>
  <div class="table-wrap">
    <table><thead><tr><th>Category</th><th>Description</th><th>Property</th><th>Amount</th><th>Date</th><th>Paid by</th></tr></thead>
    <tbody>${DB.expenses.slice(0,40).map(e=>`<tr><td>${badge(e.category,'neutral')}</td><td>${e.description}</td><td>${e.propertyName}</td><td>${fmt(e.amount)}</td><td>${fmtDate(e.date)}</td><td>${e.paidBy}</td></tr>`).join('')}</tbody></table>
  </div>`;
}
function openAddExpense(){
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">Add Expense</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Category</label><select id="ex-cat">${["Electricity","Water","Internet","Maintenance","Cleaning","Salaries","Food/Mess","Repairs","Other"].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Amount (₹)</label><input id="ex-amt" type="number" placeholder="0"></div>
      <div class="field"><label>Date</label><input id="ex-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Description</label><input id="ex-desc" placeholder="Short description"></div>
      <div class="field"><label>Property</label><select id="ex-prop">${DB.properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
      <button class="btn btn-primary btn-block" onclick="submitExpense()">Add Expense</button>
    </div>`);
}
function submitExpense(){
  const amt = Number(document.getElementById('ex-amt').value)||0;
  if(amt<=0){ toast('Enter a valid amount','error'); return; }
  const prop = DB.properties.find(p=>p.id===document.getElementById('ex-prop').value);
  DB.expenses.unshift({ id:uid('EXP'), propertyId:prop.id, propertyName:prop.name, category:document.getElementById('ex-cat').value,
    amount:amt, date:document.getElementById('ex-date').value, description:document.getElementById('ex-desc').value||'Expense', paidBy:STATE.user.name });
  closeModal(); toast('Expense added successfully'); render();
}

  return `

  <div style="display:flex;flex-direction:column;gap:8px;">
    ${tenants.map(t=>`
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:10px;">

        <button class="btn btn-sm ${STATE.toggles.attendance[t.id]?'btn-primary':'btn-outline'}" onclick="STATE.toggles.attendance['${t.id}']=true;render()">Present</button>
        <button class="btn btn-sm ${!STATE.toggles.attendance[t.id]?'btn-danger':'btn-outline'}" onclick="STATE.toggles.attendance['${t.id}']=false;render()">Absent</button>
      </div>`).join('')}
  </div>`;
}

/* ================= NOTIFICATIONS ================= */
function renderNotifications(){
  return `
  ${pageHeader('Notifications', `${DB.notifications.filter(n=>!n.read).length} unread`, `<button class="btn btn-outline btn-sm" onclick="DB.notifications.forEach(n=>n.read=true);render()">Mark all read</button>`)}
  <div style="display:flex;flex-direction:column;gap:2px;">
    ${DB.notifications.map(n=>`
      <div class="card" style="padding:13px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;background:${n.read?'var(--surface)':'var(--primary-light)'};" onclick="n.read=true;render()">
        <div style="font-size:20px;">${n.icon}</div>
        <div style="flex:1;">
          <div style="font-size:13.5px;font-weight:${n.read?'500':'700'};">${n.message}</div>
          <div style="font-size:11.5px;color:var(--text-faint);margin-top:2px;">${n.type} · ${fmtDateTime(n.date)}</div>
        </div>
        ${!n.read?`<div style="width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:4px;flex-shrink:0;"></div>`:''}
      </div>`).join('')}
  </div>`;
}

/* ================= REPORTS ================= */
function renderReports(){
  const occ = occupancyFor(null);
  const collected = DB.payments.reduce((s,p)=>s+p.paidAmount,0);
  const pending = DB.tenants.reduce((s,t)=>s+t.pending,0);
  const overdue = DB.tenants.filter(t=>t.paymentStatus==='overdue').reduce((s,t)=>s+t.pending,0);
  const methodBreak = {};
  DB.payments.forEach(p=>{ methodBreak[p.method]=(methodBreak[p.method]||0)+p.paidAmount; });
  const expenseByCategory = {};
  DB.expenses.forEach(e=>{ expenseByCategory[e.category]=(expenseByCategory[e.category]||0)+e.amount; });
  const revenue = collected, expenses = DB.expenses.reduce((s,e)=>s+e.amount,0);

  return `
  ${pageHeader('Reports', 'Occupancy, collections, tenants, expenses and profit — in one place.', `<button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ Print</button><button class="btn btn-outline btn-sm" onclick="toast('Report exported (demo)','info')">⬇ Export</button>`)}

  <div style="display:grid;grid-template-columns:1fr;gap:14px;" class="reports-grid">
    <div class="card" style="padding:18px;">
      <h3 style="margin:0 0 12px;font-size:15px;">Occupancy Report</h3>
      <div class="kv"><span class="k">Total beds</span><span class="v">${occ.total}</span></div>
      <div class="kv"><span class="k">Occupied</span><span class="v">${occ.occ}</span></div>
      <div class="kv"><span class="k">Available</span><span class="v">${occ.avail}</span></div>
      <div class="kv"><span class="k">Occupancy %</span><span class="v">${Math.round(occ.occ/occ.total*100)}%</span></div>
    </div>
    <div class="card" style="padding:18px;">
      <h3 style="margin:0 0 12px;font-size:15px;">Fee Collection Report</h3>
      <div class="kv"><span class="k">Total collection</span><span class="v">${fmt(collected)}</span></div>
      <div class="kv"><span class="k">Pending</span><span class="v">${fmt(pending)}</span></div>
      <div class="kv"><span class="k">Overdue</span><span class="v">${fmt(overdue)}</span></div>
      ${Object.entries(methodBreak).map(([m,a])=>`<div class="kv"><span class="k">via ${m}</span><span class="v">${fmt(a)}</span></div>`).join('')}
    </div>
    <div class="card" style="padding:18px;">
      <h3 style="margin:0 0 12px;font-size:15px;">Tenant Report</h3>
      <div class="kv"><span class="k">Active tenants</span><span class="v">${DB.tenants.filter(t=>t.status==='Active').length}</span></div>
      <div class="kv"><span class="k">New (30 days)</span><span class="v">${DB.tenants.filter(t=>new Date(t.checkIn) > new Date(Date.now()-30*864e5)).length}</span></div>
      <div class="kv"><span class="k">Checked out</span><span class="v">${DB.tenants.filter(t=>t.status==='Checked Out').length}</span></div>
    </div>
    <div class="card" style="padding:18px;">
      <h3 style="margin:0 0 12px;font-size:15px;">Expense Report</h3>
      ${Object.entries(expenseByCategory).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,a])=>`<div class="kv"><span class="k">${c}</span><span class="v">${fmt(a)}</span></div>`).join('')}
    </div>
    <div class="card" style="padding:18px;">
      <h3 style="margin:0 0 12px;font-size:15px;">Profit Report</h3>
      <div class="kv"><span class="k">Revenue</span><span class="v">${fmt(revenue)}</span></div>
      <div class="kv"><span class="k">Expenses</span><span class="v">${fmt(expenses)}</span></div>
      <div class="kv" style="font-weight:700;"><span class="k">Net profit</span><span class="v" style="color:var(--primary)">${fmt(revenue-expenses)}</span></div>
    </div>
  </div>
  <style>@media(min-width:900px){.reports-grid{grid-template-columns:repeat(2,1fr) !important;}}@media(min-width:1300px){.reports-grid{grid-template-columns:repeat(3,1fr) !important;}}</style>
  `;
}

/* ================= SETTINGS ================= */
function renderSettings(){
  const sections = [
    {ic:'👤',label:'Profile', desc:'Your name, contact and login details'},
    {ic:'🏢',label:'Property Settings', desc:'PG details, logo and contact info'},
    {ic:'💰',label:'Fee Settings', desc:'Rent due date, late fee rules'},
    {ic:'🔔',label:'Notification Settings', desc:'Choose what alerts you receive'},
    {ic:'🔐',label:'User & Permissions', desc:'Manage roles and access'},
    {ic:'💳',label:'Payment Settings', desc:'Accepted payment methods'},
    {ic:'🧾',label:'Receipt Settings', desc:'Receipt number format and template'},
    {ic:'⚙️',label:'System Settings', desc:'Currency, timezone and general prefs'},
  ];
  return `
  ${pageHeader('Settings', 'Configure how Nestly works for your properties.')}
  <div style="display:grid;grid-template-columns:1fr;gap:10px;" class="settings-grid">
    ${sections.map(s=>`
      <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;" onclick="openSettingsPanel('${s.label}')">
        <div style="font-size:22px;">${s.ic}</div>
        <div style="flex:1;"><div style="font-weight:700;font-size:14px;">${s.label}</div><div style="font-size:12px;color:var(--text-faint);">${s.desc}</div></div>
        <div style="color:var(--text-faint);">›</div>
      </div>`).join('')}
  </div>
  <style>@media(min-width:760px){.settings-grid{grid-template-columns:repeat(2,1fr) !important;}}</style>`;
}
function openSettingsPanel(label){
  let body = `<p style="font-size:13.5px;color:var(--text-muted);">This settings panel is fully mocked for the demo.</p>`;
  if(label==='Fee Settings') body = `
    <div class="field"><label>Currency</label><select><option>INR (₹)</option><option>USD ($)</option></select></div>
    <div class="field"><label>Default rent due date</label><select><option>5th of every month</option><option>1st of every month</option></select></div>
    <div class="field"><label>Late fee (₹/day)</label><input type="number" value="50"></div>`;
  if(label==='Property Settings') body = `
    <div class="field"><label>PG name</label><input value="Sunrise PG"></div>
    <div class="field"><label>Contact number</label><input value="+91 98480 11223"></div>
    <div class="field"><label>Address</label><textarea rows="2">Plot 14, Financial District Rd, Gachibowli</textarea></div>`;
  openModal(`
    <div class="modal-head"><h3 style="margin:0;font-size:16px;">${label}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">${body}<button class="btn btn-primary btn-block" style="margin-top:6px;" onclick="closeModal();toast('Settings saved')">Save Changes</button></div>`);
}

/* ---------------- GLOBAL HANDLERS ---------------- */
function attachGlobalHandlers(){
  document.getElementById('app').addEventListener('click', (e)=>{
    const navEl = e.target.closest('[data-nav]');
    if(navEl){ go(navEl.dataset.nav); return; }
    const actionEl = e.target.closest('[data-action]');
    if(actionEl){
      const a = actionEl.dataset.action;
      if(a==='logout') logout();
      else if(a==='open-search') openSearch();
      else if(a==='open-more') openMoreSheet();
      else if(a==='open-profile') openProfileMenu();
      else if(a==='fab-action') fabAction();
      return;
    }
  }, { once:false });
}

/* Keyboard shortcut: Escape closes modal */
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

/* ---------------- INIT ---------------- */
document.body.setAttribute('data-theme', STATE.theme);
render();
</script>
</body>
</html>
